<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siege of the Sun - V3 Visual Polish</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-box {
            background: linear-gradient(180deg, rgba(20,20,20,0.9) 0%, rgba(0,0,0,0.8) 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid rgba(255, 165, 0, 0.6);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            text-shadow: 1px 1px 2px black;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-gold { color: #ffd700; font-size: 18px; }
        .icon-hp { color: #ff4d4d; font-size: 18px; }
        .icon-wave { color: #ffa500; font-size: 18px; }

        .hp-container {
            width: 150px;
            height: 12px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
        }

        #hp-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ff0000);
            transition: width 0.1s ease-out;
            box-shadow: 0 0 5px #ff0000;
        }

        /* Bottom Shop Panel */
        #shop-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.85);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 165, 0, 0.3);
            display: flex;
            gap: 15px;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        .upgrade-btn {
            background: linear-gradient(180deg, #ff8c00 0%, #e65c00 100%);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 110px;
            box-shadow: 0 4px 0 #b34700, 0 5px 10px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }

        .upgrade-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b34700, 0 8px 15px rgba(0,0,0,0.4);
            filter: brightness(1.1);
        }

        .upgrade-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b34700, 0 2px 5px rgba(0,0,0,0.3);
        }

        .upgrade-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.7;
        }

        .btn-cost {
            font-size: 12px;
            margin-top: 4px;
            color: #ffe066;
            font-weight: normal;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.95) 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            pointer-events: auto;
        }

        h1 {
            font-size: 4rem;
            color: #ffa500;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.5);
        }

        button.restart-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(180deg, #ff8c00 0%, #e65c00 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 5px 0 #b34700;
        }

        button.restart-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        
        button.restart-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 0 #b34700;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="stat-box">
                <span class="icon-hp">❤️</span>
                <div class="hp-container"><div id="hp-fill"></div></div>
            </div>
            <div class="stat-box">
                <span class="icon-gold">🪙</span>
                <span id="gold-text">0</span>
            </div>
            <div class="stat-box">
                <span class="icon-wave">⚔️</span>
                Wave <span id="wave-text">1</span>
            </div>
        </div>
    </div>

    <!-- Shop Interface -->
    <div id="shop-panel">
        <button class="upgrade-btn" id="btn-upgrade-dmg" onclick="buyUpgrade('damage')">
            ⚡ Damage Up
            <span class="btn-cost" id="cost-dmg">Cost: 50g</span>
        </button>
        <button class="upgrade-btn" id="btn-upgrade-speed" onclick="buyUpgrade('speed')">
            🔥 Fire Rate
            <span class="btn-cost" id="cost-spd">Cost: 50g</span>
        </button>
    </div>

    <div id="game-over-screen">
        <h1>FALLEN KINGDOM</h1>
        <p style="font-size: 1.5rem; margin-bottom: 30px; color: #ccc;">The siege has broken your defenses...</p>
        <button class="restart-btn" onclick="resetGame()">Rise Again</button>
    </div>

<script>
/**
 * SIEGE OF THE SUN - V3 VISUAL POLISH
 * Focus: Lighting, Shadows, Particles, Detailed Sprites
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// UI Elements
const hpFill = document.getElementById('hp-fill');
const goldText = document.getElementById('gold-text');
const waveText = document.getElementById('wave-text');
const gameOverScreen = document.getElementById('game-over-screen');
const btnDmg = document.getElementById('btn-upgrade-dmg');
const btnSpd = document.getElementById('btn-upgrade-speed');
const costDmgEl = document.getElementById('cost-dmg');
const costSpdEl = document.getElementById('cost-spd');

// Game Constants & State
let width, height;
let horizonY; 

const GAME_CONFIG = {
    baseSpeed: 3,
    zombieSpawnRate: 2000,
    arrowSpeed: 14,
    archerRange: 450
};

let gameState = {
    isRunning: true,
    gold: 0,
    towerHP: 100,
    maxTowerHP: 100,
    distance: 0,
    frameCount: 0,
    
    damageLevel: 1,
    fireRateLevel: 1,
    damageBase: 10,
    fireRateBase: 60, 
    
    costDamage: 50,
    costFireRate: 50
};

// Entities Arrays
let zombies = [];
let arrows = [];
let particles = []; 
let floatingTexts = []; // For gold numbers drawn on canvas
let layers = [];

// --- UTILS ---

function random(min, max) {
    return Math.random() * (max - min) + min;
}

// --- CLASSES ---

class Particle {
    constructor(x, y, color, type = 'spark') {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type;
        
        if (type === 'blood') {
            this.vx = random(-2, 2);
            this.vy = random(-3, -1);
            this.gravity = 0.2;
            this.size = random(2, 4);
            this.life = 1.0;
            this.decay = 0.03;
        } else if (type === 'smoke') {
            this.vx = random(-0.5, 0.5);
            this.vy = random(-1, -0.2);
            this.size = random(5, 10);
            this.life = 1.0;
            this.decay = 0.01;
            this.alpha = 0.5;
        } else { // spark/gold
            this.vx = random(-3, 3);
            this.vy = random(-3, 3);
            this.size = random(2, 5);
            this.life = 1.0;
            this.decay = 0.05;
        }
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        
        if (this.type === 'blood') {
            this.vy += this.gravity;
        }
    }

    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class FloatingText {
    constructor(text, x, y, color = '#ffd700') {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.life = 1.0;
        this.velocity = 1.5;
    }

    update() {
        this.y -= this.velocity;
        this.life -= 0.02;
    }

    draw(ctx) {
        if (this.life <= 0) return;
        ctx.globalAlpha = this.life;
        ctx.font = "bold 16px Arial";
        ctx.fillStyle = this.color;
        ctx.strokeStyle = "black";
        ctx.lineWidth = 2;
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1.0;
    }
}

class Arrow {
    constructor(startX, startY, targetZombie) {
        this.x = startX;
        this.y = startY;
        this.target = targetZombie;
        this.speed = GAME_CONFIG.arrowSpeed;
        this.active = true;
        this.angle = 0;
        this.trail = []; // Store previous positions for trail effect
    }

    update() {
        if (!this.active || !this.target || this.target.dead) {
            this.active = false;
            return;
        }

        // Trail logic
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > 5) this.trail.shift();

        const dx = this.target.x + this.target.width/2 - this.x;
        const dy = this.target.y - this.target.height/2 - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        this.angle = Math.atan2(dy, dx);

        if (dist < this.speed) {
            // Hit
            this.active = false;
            this.target.takeHit(gameState.damageBase * gameState.damageLevel);
            
            // Blood particles
            for(let i=0; i<8; i++) {
                particles.push(new Particle(this.x, this.y, '#8a0000', 'blood'));
            }
        } else {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw(ctx) {
        if (!this.active) return;
        
        // Draw Trail
        ctx.beginPath();
        if(this.trail.length > 0) {
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for(let p of this.trail) ctx.lineTo(p.x, p.y);
            ctx.lineTo(this.x, this.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        // Shaft
        ctx.strokeStyle = '#5D4037';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(10, 0);
        ctx.stroke();

        // Head (Metallic look)
        ctx.fillStyle = '#CFD8DC';
        ctx.shadowColor = "#fff";
        ctx.shadowBlur = 2;
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(6, -3);
        ctx.lineTo(6, 3);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        // Fletching
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(-20, -4);
        ctx.lineTo(-18, 0);
        ctx.lineTo(-20, 4);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }
}

class Archer {
    constructor(side, yOffset) {
        this.side = side; // 'left' or 'right'
        this.yOffset = yOffset;
        this.cooldown = 0;
        this.currentX = 0;
        this.currentY = 0;
        this.bowDrawn = 0; // Animation state 0-1
    }

    update(tower) {
        const tx = tower.x;
        const ty = tower.y;
        
        // Position relative to tower walls
        if (this.side === 'left') {
            this.currentX = tx - 5; 
            this.currentY = ty + this.yOffset;
        } else {
            this.currentX = tx + tower.width + 5; 
            this.currentY = ty + this.yOffset;
        }

        // Cooldown & Shooting Logic
        if (this.cooldown > 0) {
            this.cooldown--;
            this.bowDrawn = Math.max(0, this.bowDrawn - 0.1); // Relax bow
        } else {
            let closestZombie = null;
            let minDist = Infinity;

            for (let z of zombies) {
                if (z.dead) continue;
                const d = Math.hypot(z.x - this.currentX, z.y - this.currentY);
                if (d < GAME_CONFIG.archerRange && d < minDist) {
                    minDist = d;
                    closestZombie = z;
                }
            }

            if (closestZombie) {
                this.shoot(closestZombie);
                this.cooldown = Math.max(10, 60 - (gameState.fireRateLevel * 5));
                this.bowDrawn = 1; // Snap bow tight
            }
        }
    }

    shoot(target) {
        arrows.push(new Arrow(this.currentX, this.currentY, target));
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.currentX, this.currentY);
        
        // Flip if right side
        if (this.side === 'right') ctx.scale(-1, 1);

        // Body (Robe)
        ctx.fillStyle = '#2E7D32'; // Dark Green
        ctx.fillRect(-6, -15, 12, 18);
        
        // Hood/Head
        ctx.fillStyle = '#1B5E20';
        ctx.beginPath();
        ctx.arc(0, -18, 7, 0, Math.PI*2);
        ctx.fill();
        
        // Face shadow
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(2, -18, 4, 0, Math.PI*2);
        ctx.fill();

        // Bow String Animation
        const pull = this.bowDrawn * 5; 
        
        // Bow Arm
        ctx.strokeStyle = '#5D4037';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(10 + pull, -10); // Hand pulls back
        ctx.stroke();

        // The Bow itself
        ctx.strokeStyle = '#8D6E63';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(10 + pull, -10, 8, Math.PI/2, Math.PI*1.5);
        ctx.stroke();

        // Arrow nocked (if ready)
        if (this.cooldown < 10) {
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(10 + pull, -10);
            ctx.lineTo(25, -10);
            ctx.stroke();
        }

        ctx.restore();
    }
}

class Zombie {
    constructor(startX, startY, type = 'normal') {
        this.x = startX;
        this.y = startY;
        this.width = 30;
        this.height = 50;
        this.type = type;
        
        if (type === 'fast') {
            this.speed = 2.5 + Math.random();
            this.hp = 15;
            this.colorBody = '#9C27B0'; // Purple
            this.goldValue = 10;
            this.eyeColor = '#FFEB3B';
        } else if (type === 'tank') {
            this.speed = 0.8;
            this.hp = 60;
            this.width = 45;
            this.height = 60;
            this.colorBody = '#D32F2F'; // Red
            this.goldValue = 25;
            this.eyeColor = '#FFF';
        } else {
            this.speed = 1.2 + Math.random() * 0.8;
            this.hp = 20;
            this.colorBody = '#558B2F'; // Olive
            this.goldValue = 5;
            this.eyeColor = '#F44336';
        }

        this.maxHp = this.hp;
        this.dead = false;
        this.animFrame = 0;
        this.hitFlash = 0;
    }

    takeHit(damage) {
        this.hp -= damage;
        this.hitFlash = 5; // Frames to flash white
        if (this.hp <= 0) {
            this.die();
        }
    }

    die() {
        this.dead = true;
        gameState.gold += this.goldValue;
        updateUI();
        
        // Gold Text
        floatingTexts.push(new FloatingText(`+${this.goldValue}`, this.x, this.y - 30, '#FFD700'));
        
        // Death Explosion
        for(let i=0; i<15; i++) {
            particles.push(new Particle(this.x + this.width/2, this.y - this.height/2, this.colorBody, 'blood'));
        }
        // Smoke puff
        for(let i=0; i<5; i++) {
            particles.push(new Particle(this.x + this.width/2, this.y - this.height/2, '#555', 'smoke'));
        }
    }

    update(towerLeftEdge, towerRightEdge) {
        if (this.dead) return;

        this.x -= this.speed;
        this.animFrame++;
        if (this.hitFlash > 0) this.hitFlash--;

        // Collision with Tower
        if (this.x + this.width >= towerLeftEdge && this.x <= towerRightEdge) {
            gameState.towerHP -= 0.15; 
            updateUI();
            this.x += this.speed * 0.5; 
            
            // Screen shake effect could go here
            
            if (gameState.towerHP <= 0) {
                endGame();
            }
        }
    }

    draw(ctx) {
        if (this.dead) return;

        const bob = Math.sin(this.animFrame * 0.15) * 3;
        const lean = Math.sin(this.animFrame * 0.1) * 2;

        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + bob);
        ctx.rotate(lean * 0.05);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 0, this.width/2, 5, 0, 0, Math.PI*2);
        ctx.fill();

        // Flash effect when hit
        if (this.hitFlash > 0) {
            ctx.filter = 'brightness(200%)';
        }

        // Legs (Simple ragged pants)
        ctx.fillStyle = '#333';
        ctx.fillRect(-8, -15, 6, 15);
        ctx.fillRect(2, -15, 6, 15);

        // Body (Torn shirt)
        ctx.fillStyle = this.colorBody;
        ctx.beginPath();
        ctx.moveTo(-10, -15);
        ctx.lineTo(10, -15);
        ctx.lineTo(8, -35);
        ctx.lineTo(-8, -35);
        ctx.closePath();
        ctx.fill();
        
        // Details on clothes
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-5, -25, 10, 5);

        // Arms (Reaching forward)
        ctx.strokeStyle = this.colorBody;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-8, -30);
        ctx.lineTo(-15, -20); // Left arm down/back
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(8, -30);
        ctx.lineTo(15, -35); // Right arm up/reach
        ctx.stroke();

        // Head
        ctx.fillStyle = '#AED581'; // Pale green skin
        ctx.beginPath();
        ctx.arc(0, -42, 10, 0, Math.PI*2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = this.eyeColor;
        ctx.shadowColor = this.eyeColor;
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(-3, -44, 2, 0, Math.PI*2);
        ctx.arc(3, -44, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Mouth (Grimace)
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-2, -38);
        ctx.lineTo(2, -38);
        ctx.stroke();

        ctx.restore();
        
        // Health Bar above head
        if (this.hp < this.maxHp) {
            const hpPct = this.hp / this.maxHp;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(this.x, this.y - this.height - 15, this.width, 4);
            ctx.fillStyle = hpPct > 0.5 ? '#4CAF50' : (hpPct > 0.2 ? '#FF9800' : '#F44336');
            ctx.fillRect(this.x, this.y - this.height - 15, this.width * hpPct, 4);
        }
    }
}

class Tower {
    constructor() {
        this.width = 140; // Wider for better visuals
        this.height = 200;
        this.wheelRotation = 0;
        this.archers = [
            new Archer('left', 60),
            new Archer('left', 120),
            new Archer('right', 60),
            new Archer('right', 120)
        ];
    }

    update(scrollSpeed) {
        this.wheelRotation += scrollSpeed * 0.1;
        this.archers.forEach(a => a.update(this));
    }

    draw(ctx) {
        const tx = this.x;
        const ty = this.y;

        // Wheels
        const wheelRadius = 30;
        const wheelY = ty + this.height - 15;
        
        [-25, this.width - 25].forEach(offsetX => {
            // Tire
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(tx + offsetX, wheelY, wheelRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Rim
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(tx + offsetX, wheelY, wheelRadius - 5, 0, Math.PI * 2);
            ctx.stroke();

            // Spokes
            ctx.strokeStyle = '#777';
            ctx.lineWidth = 2;
            for(let i=0; i<6; i++) {
                const angle = this.wheelRotation + (Math.PI / 3) * i;
                ctx.beginPath();
                ctx.moveTo(tx + offsetX, wheelY);
                ctx.lineTo(tx + offsetX + Math.cos(angle)*(wheelRadius-5), wheelY + Math.sin(angle)*(wheelRadius-5));
                ctx.stroke();
            }
        });

        // Chassis Base
        ctx.fillStyle = '#3E2723';
        ctx.fillRect(tx - 15, ty + this.height - 45, this.width + 30, 15);

        // Main Walls (Wood Texture Simulation)
        ctx.fillStyle = '#6D4C41';
        ctx.fillRect(tx, ty, this.width, this.height - 45);
        
        // Vertical Planks
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        for(let i=1; i<6; i++) {
            ctx.beginPath();
            ctx.moveTo(tx + i*(this.width/6), ty);
            ctx.lineTo(tx + i*(this.width/6), ty + this.height - 45);
            ctx.stroke();
        }
        
        // Horizontal Support Beams
        ctx.fillStyle = '#4E342E';
        ctx.fillRect(tx - 5, ty + 50, this.width + 10, 8);
        ctx.fillRect(tx - 5, ty + 120, this.width + 10, 8);

        // Battlements (Top Teeth)
        const toothW = 20;
        const toothH = 15;
        ctx.fillStyle = '#5D4037';
        for(let i=0; i<this.width/toothW; i++) {
             if(i % 2 === 0) {
                 ctx.fillRect(tx + i * toothW, ty - toothH, toothW, toothH);
                 // Highlight on teeth
                 ctx.fillStyle = '#795548';
                 ctx.fillRect(tx + i * toothW, ty - toothH, toothW, 3);
                 ctx.fillStyle = '#5D4037';
             }
        }

        // King Platform Roof
        ctx.fillStyle = '#BF360C'; // Deep Red Banner/Roof
        ctx.beginPath();
        ctx.moveTo(tx - 10, ty - 10);
        ctx.lineTo(tx + this.width/2, ty - 40);
        ctx.lineTo(tx + this.width + 10, ty - 10);
        ctx.fill();
        
        // Gold Trim on Roof
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(tx - 10, ty - 10);
        ctx.lineTo(tx + this.width/2, ty - 40);
        ctx.lineTo(tx + this.width + 10, ty - 10);
        ctx.stroke();

        // The King
        const kx = tx + this.width/2;
        const ky = ty - 25;
        
        // Robe
        ctx.fillStyle = '#7B1FA2'; // Royal Purple
        ctx.beginPath();
        ctx.moveTo(kx - 12, ky);
        ctx.lineTo(kx + 12, ky);
        ctx.lineTo(kx + 15, ky + 25);
        ctx.lineTo(kx - 15, ky + 25);
        ctx.fill();
        
        // Crown
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.moveTo(kx - 10, ky - 5);
        ctx.lineTo(kx - 10, ky - 15);
        ctx.lineTo(kx - 5, ky - 10);
        ctx.lineTo(kx, ky - 20);
        ctx.lineTo(kx + 5, ky - 10);
        ctx.lineTo(kx + 10, ky - 15);
        ctx.lineTo(kx + 10, ky - 5);
        ctx.fill();
        
        // Gem on Crown
        ctx.fillStyle = '#F44336';
        ctx.beginPath();
        ctx.arc(kx, ky - 12, 2, 0, Math.PI*2);
        ctx.fill();

        // Draw Archers last so they are in front of walls
        this.archers.forEach(a => a.draw(ctx));
    }
}

class Horse {
    constructor(offsetFromTowerFront) {
        this.offset = offsetFromTowerFront;
        this.frame = 0;
    }

    update() {
        this.frame++;
    }

    draw(ctx, baseX, baseY) {
        const legSwing = Math.sin(this.frame * 0.2) * 12;
        const bobbing = Math.abs(Math.cos(this.frame * 0.2)) * 6;

        ctx.save();
        ctx.translate(baseX + this.offset, baseY - bobbing);
        
        // Shadow under horse
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 25, 30, 5, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#3E2723'; // Dark Brown
        
        // Body
        ctx.beginPath();
        ctx.ellipse(0, -15, 35, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        ctx.strokeStyle = '#281815';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        
        // Back Legs
        ctx.beginPath(); ctx.moveTo(20, -10); ctx.lineTo(25 - legSwing, 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(25, -10); ctx.lineTo(30 + legSwing, 20); ctx.stroke();
        
        // Front Legs
        ctx.beginPath(); ctx.moveTo(-20, -10); ctx.lineTo(-25 + legSwing, 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-15, -10); ctx.lineTo(-20 - legSwing, 20); ctx.stroke();

        // Neck & Head
        ctx.fillStyle = '#3E2723';
        ctx.beginPath();
        ctx.moveTo(-25, -15);
        ctx.quadraticCurveTo(-45, -35, -55, -25); // Neck curve
        ctx.lineTo(-65, -15); // Nose tip
        ctx.lineTo(-55, -5); // Jaw
        ctx.closePath();
        ctx.fill();

        // Mane
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-30, -25);
        ctx.quadraticCurveTo(-40, -40, -50, -30);
        ctx.stroke();

        // Tail
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(35, -15);
        ctx.quadraticCurveTo(55, -5 + legSwing/2, 45, 15);
        ctx.stroke();

        ctx.restore();
    }
}

// Background Layers Class
class BackgroundLayer {
    constructor(type, speedMultiplier) {
        this.type = type;
        this.speedMult = speedMultiplier;
        this.items = [];
        this.generateItems();
    }

    generateItems() {
        const count = Math.ceil(width / 150) + 2;
        for (let i = 0; i < count; i++) {
            let item = {};
            if (this.type === 'mountains') {
                item.x = i * (width / count) + random(0, 100);
                item.w = random(200, 400);
                item.h = random(100, 250);
                item.color = this.speedMult < 0.3 ? '#4a1c1c' : '#2d1111'; // Far vs Near colors
                item.opacity = this.speedMult < 0.3 ? 0.6 : 0.9;
            } else if (this.type === 'decor') {
                item.x = i * (width / count) + random(0, 50);
                item.type = Math.random() > 0.6 ? 'rock' : 'cactus';
                item.size = random(20, 40);
            }
            this.items.push(item);
        }
    }

    update(deltaX) {
        const moveAmount = deltaX * this.speedMult;
        this.items.forEach(item => {
            item.x -= moveAmount;
            if (item.x + (item.w || item.size) < -100) {
                item.x = width + random(0, 100);
                if (this.type === 'mountains') {
                    item.w = random(200, 400);
                    item.h = random(100, 250);
                } else if (this.type === 'decor') {
                    item.type = Math.random() > 0.6 ? 'rock' : 'cactus';
                    item.size = random(20, 40);
                }
            }
        });
    }

    draw(ctx) {
        if (this.type === 'mountains') {
            this.items.forEach(item => {
                ctx.globalAlpha = item.opacity;
                ctx.fillStyle = item.color;
                ctx.beginPath();
                ctx.moveTo(item.x, horizonY);
                ctx.lineTo(item.x + item.w / 2, horizonY - item.h);
                ctx.lineTo(item.x + item.w, horizonY);
                ctx.fill();
                
                // Snow cap or highlight? No, desert sunset. Maybe rim light.
                ctx.strokeStyle = 'rgba(255, 100, 0, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(item.x + item.w/2, horizonY - item.h);
                ctx.lineTo(item.x + item.w, horizonY);
                ctx.stroke();
            });
            ctx.globalAlpha = 1.0;
        } else if (this.type === 'decor') {
            this.items.forEach(item => {
                if (item.type === 'cactus') {
                    ctx.fillStyle = '#2E7D32';
                    // Main stem
                    roundRect(ctx, item.x, horizonY - item.size, item.size/3, item.size, 5);
                    // Arms
                    roundRect(ctx, item.x - item.size/3, horizonY - item.size*0.6, item.size/3, item.size/2, 3);
                    roundRect(ctx, item.x + item.size/3, horizonY - item.size*0.7, item.size/3, item.size/2, 3);
                    
                    // Highlights
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(item.x + 2, horizonY - item.size + 2, item.size/3 - 4, item.size - 4);
                } else {
                    ctx.fillStyle = '#5D4037';
                    ctx.beginPath();
                    ctx.arc(item.x + item.size/2, horizonY - item.size/4, item.size/2, 0, Math.PI * 2);
                    ctx.fill();
                    // Rock detail
                    ctx.fillStyle = '#795548';
                    ctx.beginPath();
                    ctx.arc(item.x + item.size/2 - 2, horizonY - item.size/4 - 2, item.size/4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
    }
}

function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
}

// Global Variables
let tower;
let horse;
let lastTime = 0;
let spawnTimer = 0;
let waveNumber = 1;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    horizonY = height * 0.65; // Ground level slightly lower
    
    if (tower) {
        tower.x = width / 2 - tower.width / 2;
        tower.y = horizonY - tower.height + 45; // Adjust based on new ground
    }
}

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    gameState.isRunning = true;
    gameState.towerHP = 100;
    gameState.gold = 0;
    gameState.distance = 0;
    gameState.damageLevel = 1;
    gameState.fireRateLevel = 1;
    gameState.costDamage = 50;
    gameState.costFireRate = 50;
    
    zombies = [];
    arrows = [];
    particles = [];
    floatingTexts = [];
    
    layers = [
        new BackgroundLayer('mountains', 0.1), // Very far
        new BackgroundLayer('mountains', 0.3), // Mid
        new BackgroundLayer('decor', 1.0)      // Foreground
    ];

    tower = new Tower();
    tower.x = width / 2 - tower.width / 2;
    tower.y = horizonY - tower.height + 45; 
    
    horse = new Horse(-70);
    
    updateUI();
    gameOverScreen.style.display = 'none';
    requestAnimationFrame(gameLoop);
}

function resetGame() {
    init();
}

function spawnZombie() {
    const rand = Math.random();
    let type = 'normal';
    if (rand > 0.85) type = 'fast';
    if (rand > 0.96) type = 'tank';
    
    const z = new Zombie(width + 50, horizonY, type);
    zombies.push(z);
}

function updateUI() {
    const hpPct = Math.max(0, (gameState.towerHP / gameState.maxTowerHP) * 100);
    hpFill.style.width = `${hpPct}%`;
    goldText.innerText = gameState.gold;
    waveText.innerText = waveNumber;

    btnDmg.disabled = gameState.gold < gameState.costDamage;
    btnSpd.disabled = gameState.gold < gameState.costFireRate;
    costDmgEl.innerText = `Cost: ${gameState.costDamage}g`;
    costSpdEl.innerText = `Cost: ${gameState.costFireRate}g`;
}

function buyUpgrade(type) {
    if (type === 'damage') {
        if (gameState.gold >= gameState.costDamage) {
            gameState.gold -= gameState.costDamage;
            gameState.damageLevel++;
            gameState.costDamage = Math.floor(gameState.costDamage * 1.4);
            updateUI();
        }
    } else if (type === 'speed') {
        if (gameState.gold >= gameState.costFireRate) {
            gameState.gold -= gameState.costFireRate;
            gameState.fireRateLevel++;
            gameState.costFireRate = Math.floor(gameState.costFireRate * 1.4);
            updateUI();
        }
    }
}

function endGame() {
    gameState.isRunning = false;
    gameOverScreen.style.display = 'flex';
}

function drawSky() {
    // Complex Gradient Sunset
    const gradient = ctx.createLinearGradient(0, 0, 0, horizonY);
    gradient.addColorStop(0, '#1a0505'); // Top dark
    gradient.addColorStop(0.3, '#4a1010'); // Reddish
    gradient.addColorStop(0.6, '#ff5722'); // Bright Orange
    gradient.addColorStop(0.9, '#ffc107'); // Yellow near sun
    gradient.addColorStop(1, '#ffeb3b');   // Lightest at horizon
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, horizonY);

    // Sun Glow
    const sunX = width / 2;
    const sunY = horizonY - 80;
    
    // Outer Glow
    const glowGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 150);
    glowGrad.addColorStop(0, 'rgba(255, 255, 200, 1)');
    glowGrad.addColorStop(0.2, 'rgba(255, 200, 100, 0.8)');
    glowGrad.addColorStop(0.5, 'rgba(255, 100, 50, 0.3)');
    glowGrad.addColorStop(1, 'rgba(255, 50, 0, 0)');
    
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 150, 0, Math.PI * 2);
    ctx.fill();

    // Core Sun
    ctx.fillStyle = '#FFFDE7';
    ctx.shadowColor = '#FFFF00';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawGround() {
    // Sand Gradient
    const grad = ctx.createLinearGradient(0, horizonY, 0, height);
    grad.addColorStop(0, '#D7CCC8'); // Light sand at horizon
    grad.addColorStop(1, '#5D4037'); // Darker brown foreground
    
    ctx.fillStyle = grad;
    ctx.fillRect(0, horizonY, width, height - horizonY);
    
    // Path lines moving
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 2;
    const pathOffset = (Date.now() * 0.05) % 100;
    for(let i=0; i<5; i++) {
        ctx.beginPath();
        ctx.moveTo(0, horizonY + 20 + i*15 + pathOffset);
        ctx.lineTo(width, horizonY + 20 + i*15 + pathOffset);
        ctx.stroke();
    }
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const deltaTime = timestamp - lastTime;
    lastTime = timestamp;

    if (!gameState.isRunning) return;

    ctx.clearRect(0, 0, width, height);

    // 1. Sky
    drawSky();

    // Movement calculation
    const moveStep = GAME_CONFIG.baseSpeed * (deltaTime / 16);
    gameState.distance += moveStep;
    
    // Difficulty Scaling
    if (gameState.distance > 1000 * waveNumber) {
        waveNumber++;
        GAME_CONFIG.zombieSpawnRate = Math.max(400, 2000 - (waveNumber * 80));
    }

    // 2. Background Parallax
    layers.forEach(layer => {
        layer.update(moveStep);
        layer.draw(ctx);
    });

    // 3. Ground
    drawGround();

    // 4. Entities
    tower.update(moveStep);
    tower.draw(ctx);

    horse.update();
    horse.draw(ctx, tower.x, tower.y + tower.height - 45);

    // Zombies
    spawnTimer += deltaTime;
    if (spawnTimer > GAME_CONFIG.zombieSpawnRate) {
        spawnZombie();
        spawnTimer = 0;
    }

    // Update and Draw Zombies (Reverse loop for safe removal)
    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        z.update(tower.x, tower.x + tower.width);
        z.draw(ctx);
        
        if (z.x < -100 || z.dead) {
            zombies.splice(i, 1);
        }
    }

    // Arrows
    for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        a.update();
        a.draw(ctx);
        if (!a.active) {
            arrows.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    // Floating Texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.update();
        ft.draw(ctx);
        if (ft.life <= 0) {
            floatingTexts.splice(i, 1);
        }
    }

    requestAnimationFrame(gameLoop);
}

// Start
init();

</script>
